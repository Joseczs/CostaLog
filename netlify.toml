[build]
  publish = "public"
  command = ""

# Bloque 5c/E — los directorios se renombraron:
#   /supervisor/*  →  /ingeniero/*   (era del Ingeniero Residente)
#   /jefe/*        →  /maestro/*     (era del Maestro de Obras)
#
# Estos dos redirects existen para que un enlace viejo —guardado en un
# marcador, pegado en WhatsApp, un correo de hace tres semanas— siga
# funcionando. Van ANTES del catch-all de abajo: Netlify evalúa de arriba
# hacia abajo y se queda con la primera coincidencia.
[[redirects]]
  from = "/supervisor/*"
  to = "/ingeniero/:splat"
  status = 301

[[redirects]]
  from = "/jefe/*"
  to = "/maestro/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Nota: este redirect 404 es solo fallback. La app es multi-página
# (no SPA con router), así que cada .html se sirve directo por su ruta.
